<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Buddy 2</title>
  <meta name="description" content="Course Buddy 2 — Browse the latest courses. Click Get Access to request any course on Telegram." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3ECB2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#/" aria-label="Course Buddy 2 home">
        <span class="logo-badge">CB2</span>
        <span class="logo-text">Course Buddy <span class="logo-2">2</span></span>
      </a>

      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="searchInput" type="search" placeholder="Search courses..." autocomplete="off" aria-label="Search courses" />
      </div>

      <nav class="header-nav" aria-label="Main">
        <span class="cat-count-label" id="catCountLabel">17 categories</span>
        <div class="dropdown" id="categoryDropdown">
          <button class="btn btn-ghost" id="categoryBtn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span id="categoryBtnLabel">Browse Categories</span>
            <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div class="dropdown-menu" id="categoryMenu" role="menu"></div>
        </div>
        <a class="btn btn-ghost" href="#/watchlist">★ Watchlist <span class="count-pill" id="watchlistCount">0</span></a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <input id="searchInputMobile" type="search" placeholder="Search courses..." aria-label="Search courses" />
      <div class="mobile-cats" id="mobileCats"></div>
      <a class="btn btn-ghost" href="#/watchlist">★ Watchlist</a>
    </div>
  </header>

  <!-- ================= MAIN (rendered by JS) ================= -->
  <main id="app" class="container"></main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo-badge">CB2</span>
        <div>
          <strong>Course Buddy 2</strong>
          <p>Browse courses and request access on Telegram.</p>
        </div>
      </div>
      <div class="footer-links">
        <a id="footerTelegram" href="#" target="_blank" rel="noopener">Telegram: @CourseBuddy_Admin</a>
        <a href="#/">Home</a>
        <a href="#/watchlist">Watchlist</a>
      </div>
      <p class="copyright">© <span id="year"></span> Course Buddy 2. All rights reserved.</p>
    </div>
  </footer>

  <!-- ================= FLOATING CHAT ================= -->
  <a class="chat-fab" id="chatFab" href="#" target="_blank" rel="noopener" aria-label="Chat on Telegram">
    <img src="https://buddy7.vercel.app/buddy-avatar.webp" alt="" onerror="this.style.display='none'" />
    <span class="chat-fab-label">Chat</span>
  </a>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/bundles.js"></script>
  <script src="js/category-courses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
